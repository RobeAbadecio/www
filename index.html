<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Linking Google fonts for icons -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <a href="#" class="header-logo">
                    <img src="imges/pick_logo.jpg" id="logo_img" alt="pick_logo">
                </a>
                <button class="toggler">
                    <span class="material-symbols-rounded">chevron_left</span>
                </button>
            </header>
            <div class="sidebar-content">
                <div id="song-list" style="display:flex; flex-direction:column; gap:0.5rem;">
                    <button class="song-button add-song">
                        <span class="material-symbols-rounded">add</span>
                        <span class="button-text">Add New Song</span>
                    </button>
                </div>
                <hr />
                <!-- Save button removed: songs are auto-saved -->
                <!-- saved-songs-list removed per request -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="controls">
                <div class="play-controls">
                    <button class="play-all-button">
                        <span class="material-symbols-rounded">play_arrow</span>
                        <span class="button-text">Play</span>
                    </button>
                    <button class="stop-button">
                        <span class="material-symbols-rounded">stop</span>
                        Stop
                    </button>
                </div>
                <div class="progress-wrap">
                    <div class="progress-bar" aria-hidden="true">
                        <div class="progress-fill" style="width:0%"></div>
                    </div>
                </div>
            </div>
            <div class="tab-container">
                <!-- Empty Guitar Tab Section -->
                <div class="tab-section">
                    <pre class="tab-content">e|--------------------------------------
B|--------------------------------------
G|--------------------------------------
D|--------------------------------------
A|--------------------------------------
E|--------------------------------------|</pre>
                </div>

                <!-- Add New Tab Button -->
                <button class="add-tab-button">
                    <span class="material-symbols-rounded">add_box</span>
                    Add New Tab Section
                </button>
            </div>
        </main>
    </div>


</body>

</html>

<!-- Note edit modal -->
<div id="note-modal" class="modal" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <h3>Edit Note</h3>
        <label>
            Value (fret or symbol)
            <input id="note-value" type="text" maxlength="2" />
        </label>
        <label>
            Delay (ms)
            <input id="note-delay" type="number" min="0" value="500" />
        </label>
        <div class="modal-actions">
            <button id="note-save">Save</button>
            <button id="note-cancel">Cancel</button>
        </div>
    </div>
</div>
