<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Tabs Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }

        .log {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .error {
            background: #fee;
            border-color: #fcc;
        }

        .success {
            background: #efe;
            border-color: #cfc;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            background: #f9f9f9;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <h1>🎸 Guitar Tabs Debug Console</h1>

    <div id="status" class="log">Initializing...</div>

    <button onclick="testAPI()">Test API</button>
    <button onclick="listSongs()">List Songs</button>
    <button onclick="clearLogs()">Clear Logs</button>

    <div id="logs"></div>

    <script>
        const logsDiv = document.getElementById('logs');
        const statusDiv = document.getElementById('status');

        function log(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            logsDiv.insertBefore(logEntry, logsDiv.firstChild);
        }

        function clearLogs() {
            logsDiv.innerHTML = '';
        }

        async function testAPI() {
            log('Testing API connection...');
            try {
                const url = '/api/guitar-tabs/songs.php';
                log(`Fetching: ${window.location.origin}${url}`);

                const response = await fetch(url);
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');

                const text = await response.text();
                log(`Response body: <pre>${text}</pre>`);

                const json = JSON.parse(text);
                if (json.success) {
                    log(`✓ API Working! Found ${json.songs?.length || 0} songs`, 'success');
                    statusDiv.innerHTML = `<strong>✓ API Connected</strong> - ${json.songs?.length || 0} songs on server`;
                    statusDiv.className = 'log success';
                } else {
                    log(`✗ API returned error: ${json.message}`, 'error');
                    statusDiv.innerHTML = `<strong>✗ API Error:</strong> ${json.message}`;
                    statusDiv.className = 'log error';
                }
            } catch (error) {
                log(`✗ Fetch failed: ${error.message}`, 'error');
                statusDiv.innerHTML = `<strong>✗ Connection Failed:</strong> ${error.message}`;
                statusDiv.className = 'log error';
            }
        }

        async function listSongs() {
            log('Fetching song list...');
            try {
                const response = await fetch('/api/guitar-tabs/songs.php');
                const json = await response.json();

                if (json.success && json.songs) {
                    if (json.songs.length === 0) {
                        log('No songs on server', 'info');
                    } else {
                        const songList = json.songs.map((s, i) =>
                            `${i+1}. <strong>${s.name}</strong> (updated: ${s.updated_at})`
                        ).join('<br>');
                        log(`Songs found:<br>${songList}`, 'success');
                    }
                } else {
                    log(`Error: ${json.message}`, 'error');
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        // Check browser info
        log(`Browser: ${navigator.userAgent}`);
        log(`Location: ${window.location.href}`);

        // Auto-test on load
        setTimeout(testAPI, 500);
    </script>
</body>

</html>
