<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
     <script src="script.js" async></script>
</head>
<body>
    <div id="container">
        <div id="output">0</div>
        <div id="input-div">
            <div class="row">
            <button class="funcBtn" onclick="add()">+</button>
            <button class="numBtn" onclick="inSeven()">7</button>
            <button class="numBtn" onclick="inEight()">8</button>
            <button class="numBtn" onclick="inNine()">9</button>
            </div>
           
              <div class="row">
            <button class="funcBtn" onclick="minus()">-</button>
            <button class="numBtn" onclick="inFour()">4</button>
            <button class="numBtn" onclick="inFive()">5</button>
            <button class="numBtn" onclick="inSix()">6</button>
            </div>     
              <div class="row">
            <button class="funcBtn" onclick="times()">*</button>
            <button class="numBtn" onclick="inOne()">1</button>
            <button class="numBtn" onclick="inTwo()">2</button>
            <button class="numBtn" onclick="inThree()">3</button>
            </div>
            <div class="row">
            <button class="funcBtn" onclick="divide()">/</button>
            <button class="numBtn" onclick="inZero()">0</button>
            <button class="numBtn" onclick="decimal()">.</button>
            <button class="numBtn" onclick="equals()">=</button>
            </div>
            <div class="row">
            <button class="funcBtn" onclick="clears()">clear</button>
                </div>
        </div>
    </div>
       

</body>
</html>
